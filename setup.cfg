[metadata]
name = tacorank
version = 0.1.0
description = Deterministic autonomous recommender research harness

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pydantic>=2,<3

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tacorank = tacorank.cli:main

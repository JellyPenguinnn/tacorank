name: Person 3 integration

on:
  pull_request:
    paths:
      - "src/tacorank/coding/**"
      - "src/tacorank/git/**"
      - "src/tacorank/safety/**"
      - "src/tacorank/execution/**"
      - "tests/coding/**"
      - "tests/git/**"
      - "tests/safety/**"
      - "tests/execution/**"
      - "tests/failure_injection/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
      - "requirements*.txt"
      - ".github/workflows/person3.yml"
  push:
    branches: [person3]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: >-
          python -m pytest
          tests/coding
          tests/git
          tests/safety
          tests/execution
          tests/failure_injection
          tests/integration

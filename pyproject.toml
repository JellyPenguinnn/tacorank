[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacorank"
version = "0.1.0"
description = "Autonomous recommender-research harness for KuaiRand-Pure"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: exercises multiple Person 3 subsystems",
  "failure_injection: verifies bounded failure handling and cleanup",
]
